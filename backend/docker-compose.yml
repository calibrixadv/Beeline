version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: beeline_postgres
    restart: always
    environment:
      POSTGRES_USER: beeline
      POSTGRES_PASSWORD: beeline_secret
      POSTGRES_DB: beeline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  pgdata:
