services:
  db:
    image: postgres:16-alpine
    container_name: beeline_postgres
    restart: always
    environment:
      POSTGRES_USER: beeline
      POSTGRES_PASSWORD: beeline_secret
      POSTGRES_DB: beeline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  redis:
    image: redis:7-alpine
    container_name: beeline_redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - beeline_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  beeline_redis_data:
