services:
  - type: web
    name: beeline-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beeline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: beeline-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_MODE
        value: dev_sink
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  - type: redis
    name: beeline-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: volatile-lru
    ipAllowList: []

databases:
  - name: beeline-db
    databaseName: beeline_db
    user: beeline
    plan: starter
    region: frankfurt
